name: Build & Release ADBManager

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, e.g. v1.4.0'
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      BUILD_TOOLS_VERSION: "36.0.0"
      COMPILE_SDK_VERSION: "36"
      JAVAC: javac
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK (cmdline-tools + build-tools 36 + platform 36)
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o /tmp/cmdtools.zip
          unzip -q /tmp/cmdtools.zip -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      # 正式版签名密钥：Secrets 里的 PLATFORM_KS_B64 是 sign/platform.jks 的 base64。
      # 公签版无需 Secret，build.sh 会自动下载 AOSP 公开 platform 测试密钥并单独签名。
      - name: Restore self-signed platform keystore from Secrets (optional)
        run: |
          mkdir -p "${{ github.workspace }}/sign"
          if [ -n "${{ secrets.PLATFORM_KS_B64 }}" ]; then
            echo "${{ secrets.PLATFORM_KS_B64 }}" | base64 -d > "${{ github.workspace }}/sign/platform.jks"
            chmod 600 "${{ github.workspace }}/sign/platform.jks"
          else
            echo "PLATFORM_KS_B64 未配置，本次只构建公签版。"
          fi

      # 一次构建产出两个 APK（均为 v1+v2 签名）：
      #   正式版  ADBManager_v版本_日期.apk           （自签/厂商 platform.jks）
      #   公签版  ADBManager_v版本_日期_aosp-testkey.apk（AOSP testkey）
      - name: Build & sign APK
        run: bash ./build.sh

      - name: Upload signed APK (7 days)
        uses: actions/upload-artifact@v4
        with:
          name: ADBManager_signed
          path: bin/apk/ADBManager_v*.apk
          retention-days: 7
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: ADBManager ${{ github.event.inputs.release_tag || github.ref_name }}
          files: bin/apk/ADBManager_v*.apk
          generate_release_notes: true
